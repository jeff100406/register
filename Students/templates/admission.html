{% extends "base.html" %}


{% block title %}
Admission
{% endblock %}


{% block content %}

<h1 class="page-title">
    Student Admission
</h1>

<p class="page-subtitle">
    Enter the student's details below.
</p>


<div class="card">

    <form method="POST">

        {% csrf_token %}


        <div class="form-group">

            <label>
                Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter student's name"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter email address"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Phone Number
            </label>

            <input
                type="text"
                name="phone_number"
                placeholder="Enter phone number"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Course
            </label>

            <input
                type="text"
                name="course"
                placeholder="Enter course"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Date of Birth
            </label>

            <input
                type="date"
                name="date_of_birth"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Address
            </label>

            <textarea
                name="address"
                rows="4"
                placeholder="Enter address"
                required
            ></textarea>

        </div>


        <button type="submit" class="button">
            Submit Admission
        </button>


    </form>

</div>

{% endblock %}
